name: Maven Central auth check

on:
  workflow_dispatch:
  push:
    branches:
      - test/maven-central-auth

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Check Central credentials
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_USERNAME}" ] || [ -z "${MAVEN_PASSWORD}" ]; then
            echo "MAVEN_USERNAME or MAVEN_PASSWORD is empty in this workflow."
            exit 1
          fi
          echo "username length: ${#MAVEN_USERNAME}"
          echo "password length: ${#MAVEN_PASSWORD}"

          snapshot_code=$(curl -sS -o /tmp/snapshot-body.txt -w "%{http_code}" \
            -u "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" \
            -X PUT \
            -H "Content-Type: text/plain" \
            --data "auth-check" \
            "https://central.sonatype.com/repository/maven-snapshots/org/lucee/auth-check/not-an-artifact.txt")
          echo "snapshot repository status: ${snapshot_code}"
          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/snapshot-body.txt").read_text(errors="replace").strip()
          print(text[:500] if text else "(empty body)")
          PY

          portal_token=$(printf '%s:%s' "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 -w 0)
          portal_code=$(curl -sS -o /tmp/portal-body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${portal_token}" \
            "https://central.sonatype.com/api/v1/publisher/deployments")
          echo "portal API status: ${portal_code}"
          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/portal-body.txt").read_text(errors="replace").strip()
          print(text[:500] if text else "(empty body)")
          PY

          if [ "${snapshot_code}" = "401" ] || [ "${portal_code}" = "401" ]; then
            echo "Credentials were rejected."
            exit 1
          fi
          if [ "${snapshot_code}" = "403" ]; then
            echo "Credentials were accepted, but this token cannot publish to org.lucee."
            exit 1
          fi
          echo "Credentials were accepted by the snapshot repository."
