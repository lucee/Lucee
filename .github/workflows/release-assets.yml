name: Attach assets to GitHub release

# Manually attach the express zip, WAR, jar, light, zero and lco of an already published version to its GitHub release
# (same files as the "Attach Lucee artifacts" step of the build, for versions built before that step existed).
# LDEV-6529 / LDEV-7032: there is no local build here, so:
# - jar, light, zero, lco, express and WAR come from maven.lucee-services.com
#   (Maven layout under org/lucee/lucee/<version>/), renamed to the GitHub release file names
# - if express or WAR is not published there, it is built from the jar with
#   .github/scripts/build-express.sh / build-war.sh, like the build does
# - installers have no Maven equivalent and are still copied from cdn.lucee.org when present

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Lucee version, for example 7.0.6.9-RC'
        required: true
        type: string
      target:
        description: 'Commit SHA or branch the release is tagged on, only needed if the tag (version without qualifier) does not exist yet'
        required: false
        type: string
      installers_only:
        description: 'Only attach the installers (copied from cdn.lucee.org if they exist there), skip jar, light, zero, lco and express zip'
        required: false
        type: boolean
        default: false
      war_only:
        description: 'Only attach the WAR (copied from maven.lucee-services.com), skip everything else'
        required: false
        type: boolean
        default: false

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      TARGET: ${{ inputs.target }}
    steps:
    - name: Validate version
      run: |
        if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-(RC|BETA|ALPHA))?$'; then
          echo "::error::[$VERSION] is not a release version (snapshots are not released)"; exit 1
        fi
    - uses: actions/checkout@v4
      with:
        sparse-checkout: .github/scripts
    - name: Download jar, light, zero and lco from maven.lucee-services.com
      if: ${{ !inputs.installers_only && !inputs.war_only }}
      run: |
        set -euo pipefail
        mkdir -p release-assets
        MVN="https://maven.lucee-services.com/org/lucee/lucee/$VERSION"
        curl -fsSL --retry 3 -o "release-assets/lucee-$VERSION.jar" "$MVN/lucee-$VERSION.jar"
        curl -fsSL --retry 3 -o "release-assets/lucee-light-$VERSION.jar" "$MVN/lucee-$VERSION-light.jar"
        curl -fsSL --retry 3 -o "release-assets/lucee-zero-$VERSION.jar" "$MVN/lucee-$VERSION-zero.jar"
        curl -fsSL --retry 3 -o "release-assets/$VERSION.lco" "$MVN/lucee-$VERSION.lco"
    - name: Express zip (maven.lucee-services.com if published there, otherwise built from the jar)
      if: ${{ !inputs.installers_only && !inputs.war_only }}
      run: |
        set -euo pipefail
        EXPRESS="release-assets/lucee-express-$VERSION.zip"
        # Maven layout name is lucee-<version>-express.zip; GitHub release name stays lucee-express-<version>.zip
        if curl -fsSL --retry 3 -o "$EXPRESS" "https://maven.lucee-services.com/org/lucee/lucee/$VERSION/lucee-$VERSION-express.zip" && unzip -tq "$EXPRESS"; then
          echo "using maven.lucee-services.com/org/lucee/lucee/$VERSION/lucee-$VERSION-express.zip"
        else
          rm -f "$EXPRESS"
          echo "lucee-$VERSION-express.zip is not on maven.lucee-services.com, building it from the jar"
          .github/scripts/build-express.sh "$VERSION" "release-assets/lucee-$VERSION.jar" "$EXPRESS"
        fi
        ls -l release-assets
    - name: WAR (maven.lucee-services.com if published there, otherwise built from the jar)
      if: ${{ !inputs.installers_only }}
      run: |
        set -euo pipefail
        mkdir -p release-assets
        WAR="release-assets/lucee-$VERSION.war"
        if curl -fsSL --retry 3 -o "$WAR" "https://maven.lucee-services.com/org/lucee/lucee/$VERSION/lucee-$VERSION.war" && unzip -tq "$WAR"; then
          echo "using maven.lucee-services.com/org/lucee/lucee/$VERSION/lucee-$VERSION.war"
        elif [ "${{ inputs.war_only }}" = "true" ]; then
          rm -f "$WAR"
          echo "lucee-$VERSION.war is not on maven.lucee-services.com, nothing to attach"
        else
          rm -f "$WAR"
          echo "lucee-$VERSION.war is not on maven.lucee-services.com, building it from the jar"
          .github/scripts/build-war.sh "$VERSION" "release-assets/lucee-$VERSION.jar" "$WAR"
        fi
    # No Maven equivalent: these files are not under org/lucee/lucee/<version>/ (HEAD 404).
    - name: Installers (copied byte for byte from cdn.lucee.org, only those that exist there)
      if: ${{ !inputs.war_only }}
      run: |
        set -euo pipefail
        mkdir -p release-assets
        for n in windows-x64-installer.exe linux-x64-installer.run linux-aarch64-installer.run; do
          f="lucee-$VERSION-$n"
          if curl -fsSL --retry 3 -o "release-assets/$f" "https://cdn.lucee.org/$f"; then
            ls -l "release-assets/$f"
          else
            rm -f "release-assets/$f"
            echo "$f is not on cdn.lucee.org, skipping"
          fi
        done
    - name: Create the release if needed and upload the files
      run: |
        set -euo pipefail
        if [ -z "$(ls -A release-assets)" ]; then
          echo "nothing to attach for $VERSION"; exit 0
        fi
        # LDEV-6106: <file>.sha256 and <file>.sha512 for every file, verify with sha256sum -c <file>.sha256
        .github/scripts/write-hashes.sh release-assets
        # LDEV-6701: the release tag is the numeric version without qualifier (7.1.2.184-RC -> 7.1.2.184),
        # the same tag main.yml creates and the one Lucee looks up for the GitHub release fallback
        TAG="${VERSION%%-*}"
        if [ "$TAG" != "$VERSION" ] && gh release view "$VERSION" > /dev/null 2>&1; then
          echo "::warning::an older release is tagged with the full version $VERSION, the files go to the release tagged $TAG"
        fi
        if NAME=$(gh release view "$TAG" --json name --jq .name 2> /dev/null); then
          # same as main.yml: upload into the existing release, but never mix the files of an RC and a final with the same number
          if [ "$NAME" != "Lucee $VERSION" ]; then
            echo "::error::the release tagged $TAG is [$NAME], not Lucee $VERSION; not attaching the files of $VERSION to it"; exit 1
          fi
        else
          ARGS=(--title "Lucee $VERSION" --notes "Lucee $VERSION")
          case "$VERSION" in *-RC|*-BETA|*-ALPHA) ARGS+=(--prerelease);; esac
          if [ -n "$TARGET" ]; then
            ARGS+=(--target "$TARGET")
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            ARGS+=(--verify-tag)
          else
            echo "::error::tag $TAG does not exist, provide the target (commit SHA) input"; exit 1
          fi
          gh release create "$TAG" "${ARGS[@]}"
        fi
        gh release upload "$TAG" release-assets/* --clobber
        gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name + " " + (.size|tostring))'
