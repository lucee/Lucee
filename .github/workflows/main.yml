name: Build 7.1

on: 
  workflow_call:
    inputs:
      LUCEE_TEST_JAVA_VERSION:
        required: true
        type: string
      LUCEE_BUILD_JAVA_VERSION:
        required: true
        type: string
        default: '11'
  push:
    branches:
      - '**' # thus ignoring tagging
  pull_request:
  workflow_dispatch:
    inputs:
      # LDEV-6674: releases, RCs and betas are only published by running this workflow manually
      # on a 7.1 branch with deploy ticked, like the extensions. Pushes only publish snapshots.
      deploy:
        description: 'Publish a new build (Maven, S3, GitHub release), only on 7.1 branches'
        type: boolean
        default: false
      qualifier:
        description: 'What to publish when deploy is ticked: SNAPSHOT, BETA, RC or release (final, no qualifier)'
        type: choice
        options: [SNAPSHOT, BETA, RC, release]
        default: SNAPSHOT
      LUCEE_BUILD_JAVA_VERSION:
        required: true
        type: string
        default: '11'
      LUCEE_TEST_JAVA_VERSION:
        description: Optional Java Test version, default is the build java version
        required: false
        type: string

# Run builds of the same ref one after another, so every merge on a release branch
# resolves its own revision (max tag + 1) after the previous build has tagged.
# PRs have their own ref (refs/pull/N/merge), so they are not blocked by branch builds.
# queue: max keeps up to 100 pending runs (default would keep only one and cancel older pending runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    # LDEV-6516: contents:write to annotated-tag published revisions; actions for artifacts
    permissions:
      contents: write
      actions: write
      checks: write
      pull-requests: write
      issues: read
    env:
      # LDEV-6674: a push to a 7.1 branch publishes a snapshot (not the push that only creates a branch,
      # its commit was already built on the source branch), a manual run publishes when deploy is ticked
      DO_DEPLOY: "${{ startsWith(github.ref, 'refs/heads/7.1') && ((github.event_name == 'push' && !github.event.created) || (github.event_name == 'workflow_dispatch' && inputs.deploy == true)) }}"
      QUALIFIER_INPUT: "${{ github.event_name == 'workflow_dispatch' && inputs.qualifier || 'SNAPSHOT' }}"
      # bucket behind cdn.lucee.org (ant/upload_to_s3.cfm uploads the build there, see LDEV-6537 for the cut-off)
      S3_DOWNLOAD_BUCKET: lucee-downloads
      S3_DOWNLOAD_REGION: us-east-1
      LUCEE_BUILD_JAVA_VERSION: 11
      LUCEE_TEST_JAVA_VERSION: 21
    services:
      ldap:
        image: ghcr.io/lucee/test-openldap:test-mirror
        ports:
          - 10389:10389
          - 10636:10636
      sql-server:
        image: ghcr.io/lucee/mssql-server:test-mirror
        env:
          MSSQL_PID: Express
          ACCEPT_EULA: Y
          SA_PASSWORD: Lucee!1433 # password must be complex or the service won't start
        ports:
          - 1433:1433
        options: --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P ${SA_PASSWORD} -Q 'SELECT 1' || exit 1"  --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: ghcr.io/lucee/redis:test-mirror
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379
      greenmail:
        image: ghcr.io/lucee/greenmail-standalone:test-mirror
        ports:
          - 3025:3025 #SMTP
          - 3110:3110 #POP3
          - 3143:3143 #IMAP
          - 3465:3465 #SMTPS
          - 3993:3993 #IMAPS
          - 3995:3995 #POP3S
          - 8080:8080 #API
      httpbin:
        image: ghcr.io/lucee/httpbin:test-mirror
        ports:
          - 8081:80

    steps:
    # when workflow is run via a workflow_call, these vars are found under input, which doesn't exist otherwise
    # so lets copy them over to the normal env vars

    - name: Configure Build Java Version
      if: ${{ inputs.LUCEE_BUILD_JAVA_VERSION != '' }}
      run: echo "LUCEE_BUILD_JAVA_VERSION=${{ inputs.LUCEE_BUILD_JAVA_VERSION }}" >> $GITHUB_ENV

    - name: Configure Test Java Version
      if: ${{ inputs.LUCEE_TEST_JAVA_VERSION != '' }}
      run: echo "LUCEE_TEST_JAVA_VERSION=${{ inputs.LUCEE_TEST_JAVA_VERSION }}" >> $GITHUB_ENV

    - uses: szenius/set-timezone@v2.0
      with:
        timezoneLinux: "UTC"
    - uses: actions/checkout@v4
      # Tags fetched explicitly in Resolve next revision (fetch-tags alone is unreliable on checkout v4)

    - name: Set up Test Java Version ${{ env.LUCEE_TEST_JAVA_VERSION }}
      uses: actions/setup-java@v4
      if: ${{ env.LUCEE_TEST_JAVA_VERSION != '' }}
      with:
        java-version: ${{ env.LUCEE_TEST_JAVA_VERSION }}
        distribution: 'temurin'

    - name: Stash Test Java Version Home
      if: ${{ env.LUCEE_TEST_JAVA_VERSION != '' }}
      run: echo "LUCEE_TEST_JAVA_EXEC=${{ env.JAVA_HOME }}/bin/java" >> $GITHUB_ENV

    - name: Set up build JDK '${{ env.LUCEE_BUILD_JAVA_VERSION }}'
      uses: actions/setup-java@v4
      if: ${{ env.LUCEE_TEST_JAVA_VERSION != env.LUCEE_BUILD_JAVA_VERSION }}
      with:
        java-version: '${{ env.LUCEE_BUILD_JAVA_VERSION }}'
        distribution: 'temurin'
    - name: Cache Lucee extensions
      uses: actions/cache@v4
      with:
        path: ~/work/Lucee/Lucee/cache/
        key: lucee-extensions
        restore-keys: lucee-extensions
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository/*
          !~/.m2/repository/org/lucee/lucee/
        key: ${{ runner.os }}-maven-${{ hashFiles('loader/pom.xml','core/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Import GPG key
      run: |
        if [[ ! -z "$GPG_PRIVATE_KEY" ]]; then
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        fi
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Set up MySQL (local)
      run: |
        sudo systemctl start mysql
        mysql -e 'CREATE DATABASE lucee' -uroot -proot
        mysql -e 'CREATE USER "lucee"@"localhost" IDENTIFIED WITH mysql_native_password BY "lucee";' -uroot -proot
        mysql -e 'GRANT ALL PRIVILEGES ON lucee.* TO "lucee"@"localhost"' -uroot -proot
    - name: Set up Postgres (local)
      run: |
        sudo /etc/init.d/postgresql start
        sudo -u postgres psql -c 'create database lucee;'
        sudo -u postgres psql -c "create user lucee with encrypted password 'lucee'";
        sudo -u postgres psql -c 'grant all privileges on database lucee to lucee;'
        sudo -u postgres psql -c 'grant all on schema public to lucee;' -d lucee
    - name: Start MongoDB (docker)
      run: |
        docker run -d --name mongodb -p 27017:27017 mongo:4.4
        sleep 5
    - name: Setup Memcached (docker)
      run: |
        docker run -d --name memcached -p 11211:11211 memcached:latest
        sleep 5
    # ubuntu-latest moved to Maven 3.10.0 (runner image 20261004). With it, central-publishing-maven-plugin
    # leaves org/lucee/lucee/maven-metadata-local.xml in the staging dir, which Central rejects with
    # "Bundle has content that does NOT have a .pom file: org/lucee/lucee". Pin Maven 3.9.x until the plugin handles it.
    - name: Set up Maven 3.9.16
      run: |
        MVN_VERSION=3.9.16
        MVN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION/apache-maven-$MVN_VERSION-bin.tar.gz"
        echo "$MVN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
        tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> $GITHUB_PATH
        "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin/mvn" -v
    - name: Resolve next revision
      id: resolve-revision
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ "${{ inputs.deploy }}" == "true" ] && [ "$DO_DEPLOY" != "true" ]; then
          echo "::error::deploy is only possible on 7.1 branches, not on [$GITHUB_REF]"; exit 1
        fi
        # LDEV-6516: on mainline 7.1 push (DO_DEPLOY), allocate next build from tags / Maven metadata.
        # PRs and forks keep the default POM revision and must not consume production build numbers.
        if [ "${{ env.DO_DEPLOY }}" != "true" ]; then
          echo "Skipping revision bump (not a mainline 7.1 deploy build)"
          exit 0
        fi
        # Match build step: without GPG secrets CI only runs tests — do not consume a build number
        if [ "${{ secrets.GPG_PASSPHRASE }}" == "" ]; then
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            echo "::error::deploy is ticked, but there are no GPG / deploy credentials"; exit 1
          fi
          echo "Skipping revision bump (no GPG / deploy credentials; test-only run)"
          exit 0
        fi

        BASE=$(mvn -f loader/pom.xml help:evaluate -Dexpression=lucee.version.base -q -DforceStdout | tr -d '\r')
        # LDEV-6674: the qualifier comes from the run, not from the pom: pushes publish snapshots,
        # a manual run publishes what was picked, so one version is used for Maven, S3, the tag and the GitHub release
        case "$QUALIFIER_INPUT" in
          release) QUALIFIER="" ;;
          SNAPSHOT|BETA|RC) QUALIFIER="-$QUALIFIER_INPUT" ;;
          *) echo "::error::unknown qualifier [$QUALIFIER_INPUT]"; exit 1 ;;
        esac
        echo "Base=$BASE qualifier=$QUALIFIER"

        # Ensure tags are available for max(build)+1
        git fetch --tags --force origin 2>/dev/null || true

        MAX_BUILD=""
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          build="${tag#"${BASE}".}"
          case "$build" in
            ''|*[!0-9]*) continue ;;
          esac
          if [ -z "$MAX_BUILD" ] || [ "$build" -gt "$MAX_BUILD" ]; then
            MAX_BUILD="$build"
          fi
        done < <(git tag -l "${BASE}.*")

        if [ -z "$MAX_BUILD" ]; then
          echo "No git tags matching ${BASE}.N — falling back to Maven metadata"
          META_FILES=""
          for url in \
            "https://cdn.lucee.org/org/lucee/lucee/maven-metadata.xml" \
            "https://repo1.maven.org/maven2/org/lucee/lucee/maven-metadata.xml" \
            "https://central.sonatype.com/repository/maven-snapshots/org/lucee/lucee/maven-metadata.xml"
          do
            tmp=$(mktemp)
            if curl -fsSL --max-time 30 "$url" -o "$tmp"; then
              META_FILES="$META_FILES $tmp"
            else
              rm -f "$tmp"
            fi
          done
          if [ -n "$META_FILES" ]; then
            # Match base.N or base.N-QUALIFIER
            MAX_BUILD=$(cat $META_FILES | sed -n "s/.*<version>${BASE}\.\([0-9][0-9]*\)\([-.].*\)\?<\/version>.*/\1/p" | sort -n | tail -1 || true)
            rm -f $META_FILES
          fi
        fi

        if [ -z "$MAX_BUILD" ]; then
          NEXT_BUILD=0
        else
          NEXT_BUILD=$((MAX_BUILD + 1))
        fi

        VERSION="${BASE}.${NEXT_BUILD}${QUALIFIER}"
        # Tag shape matches existing practice: numeric 4-part without -SNAPSHOT
        TAG="${BASE}.${NEXT_BUILD}"

        echo "Resolved VERSION=$VERSION (max seen build=${MAX_BUILD:-none})"
        echo "### Publishing Lucee $VERSION (tag $TAG)" >> "$GITHUB_STEP_SUMMARY"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TAG=$TAG" >> "$GITHUB_ENV"

    - name: Extract version number
      id: extract-version
      run: |
        set -euo pipefail
        if [ -z "${VERSION:-}" ]; then
          VERSION=$(mvn -f loader/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        fi
        # LDEV-6529: fail early on a bogus version (e.g. "1", the version of Maven's standalone-pom without a pom.xml)
        if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){3}(-[A-Za-z0-9]+)*$'; then
          echo "::error::[$VERSION] is not a Lucee version"; exit 1
        fi
        echo "Using VERSION=$VERSION"
    - name: Build Lucee with Maven
      env:
        MYSQL_SERVER: localhost
        MYSQL_USERNAME: lucee
        MYSQL_PASSWORD: lucee
        MYSQL_PORT: 3306
        MYSQL_DATABASE: lucee
        POSTGRES_SERVER: localhost
        POSTGRES_USERNAME: lucee
        POSTGRES_PASSWORD: lucee
        POSTGRES_PORT: 5432
        POSTGRES_DATABASE: lucee
        MONGODB_SERVER: localhost
        MONGODB_PORT: 27017
        MONGODB_DB: lucee
        MONGODB_DATABASE: lucee
        MSSQL_SERVER: localhost
        MSSQL_USERNAME: sa
        MSSQL_PASSWORD: Lucee!1433
        MSSQL_PORT: 1433
        MSSQL_DATABASE: master
        MEMCACHED_PORT: 11211
        MEMCACHED_SERVER: localhost
        REDIS_PORT: 6379
        REDIS_SERVER: localhost
        SMTP_PORT_INSECURE: 3025
        SMTP_PORT_SECURE: 3465
        SMTP_SERVER: localhost
        SMTP_USERNAME: lucee
        SMTP_PASSWORD: doesntmatter
        IMAP_PORT_INSECURE: 3143
        IMAP_PORT_SECURE: 3993
        IMAP_SERVER: localhost
        IMAP_USERNAME: lucee
        IMAP_PASSWORD: doesntmatter
        POP_PORT_INSECURE: 3110
        POP_PORT_SECURE: 3995
        POP_SERVER: localhost
        POP_USERNAME: lucee
        POP_PASSWORD: doesntmatter
        LDAP_SERVER: localhost
        LDAP_PORT: 10389
        LDAP_PORT_SECURE: 10636
        LDAP_BASE_DN: dc=planetexpress,dc=com
        LDAP_USERNAME: cn=admin,dc=planetexpress,dc=com
        LDAP_PASSWORD: GoodNewsEveryone
        HTTPBIN_SERVER: localhost
        HTTPBIN_PORT: 8081
        S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_ID_TEST }}
        S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_TEST }}
        S3_BUCKET_PREFIX: lucee-ldev-6-
        # for uploading successful builds
        S3_ACCESS_ID_DOWNLOAD: ${{ secrets.S3_ACCESS_ID_DOWNLOAD }}
        S3_SECRET_KEY_DOWNLOAD: ${{ secrets.S3_SECRET_KEY_DOWNLOAD }}
        # used by maven-settings.xml
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_SHA: ${{ github.sha }}
        LUCEE_DOCKER_FILES_PAT_TOKEN: ${{ secrets.LUCEE_DOCKER_FILES_PAT_TOKEN }}
        LUCEE_BUILD_FAIL_CONFIGURED_SERVICES_FATAL: true
      #run: ant -noinput -buildfile loader/build.xml
      run: |
        echo "-------DO_DEPLOY: ${{ env.DO_DEPLOY }} -------";
        REVISION_ARGS=()
        if [ -n "${VERSION:-}" ]; then
          REVISION_ARGS=(-Drevision="$VERSION")
          echo "------- Using -Drevision=$VERSION -------";
        fi
        if [ "${{ secrets.GPG_PASSPHRASE }}" == "" ]; then
          echo "------- Maven Test on ${{ github.event_name }} ---------";
          mvn -B -e -f loader/pom.xml "${REVISION_ARGS[@]}" test -DtestJavaVersionExec="${{ env.LUCEE_TEST_JAVA_EXEC }}"
        elif [[ "$VERSION" == *-SNAPSHOT ]]; then
          echo "------- Maven Deploy SNAPSHOT on ${{ github.event_name }} ---------";
          mvn -B -e -f loader/pom.xml "${REVISION_ARGS[@]}" clean deploy --settings maven-settings.xml -DtestJavaVersionExec="${{ env.LUCEE_TEST_JAVA_EXEC }}"
          echo "DID_DEPLOY=true" >> "$GITHUB_ENV"
        elif [[ "$VERSION" == *-ALPHA ]]; then
          echo "------- Maven Install ALPHA (no deplyment) on ${{ github.event_name }} ---------";
          mvn -B -e -f loader/pom.xml "${REVISION_ARGS[@]}" clean install -DtestJavaVersionExec="${{ env.LUCEE_TEST_JAVA_EXEC }}"
        elif [[ "$VERSION" == *-* ]]; then
          # LDEV-6707: RC, BETA and other pre-releases are not published on Maven Central anymore,
          # they go to maven.lucee-services.com (S3 upload during the build) and the GitHub release only
          echo "------- Maven Install PRE-RELEASE (not on Maven Central) on ${{ github.event_name }} -------";
          mvn -B -e -f loader/pom.xml "${REVISION_ARGS[@]}" clean install -DtestJavaVersionExec="${{ env.LUCEE_TEST_JAVA_EXEC }}"
          echo "DID_DEPLOY=true" >> "$GITHUB_ENV"
        else
          # LDEV-6707: only the .lco and the pom (pom packaging) go to Maven Central, see loader/central/pom.xml.
          # The jar, light, zero, express and WAR go to maven.lucee-services.com (S3 upload during the build) and the GitHub release only
          echo "------- Maven Deploy RELEASE (.lco and pom only) on ${{ github.event_name }} -------";
          mvn -B -e -f loader/pom.xml "${REVISION_ARGS[@]}" clean install -DtestJavaVersionExec="${{ env.LUCEE_TEST_JAVA_EXEC }}";
          if [ ! -f "loader/target/$VERSION.lco" ]; then
            echo "::error::loader/target/$VERSION.lco does not exist, nothing to publish on Maven Central"; exit 1
          fi
          mvn -B -e -f loader/central/pom.xml -Drevision="$VERSION" clean deploy --settings maven-settings.xml -DperformRelease=true;
          echo "DID_DEPLOY=true" >> "$GITHUB_ENV"
        fi
    - name: clean github.ref_name
      uses: mad9000/actions-find-and-replace-string@5
      id: cleanrefname
      if: always()
      with:
          source: ${{ github.ref_name }}
          find: '/'
          replace: '-'
    - name: Upload Artifact (junit-test-results)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Lucee-${{ steps.cleanrefname.outputs.value }}-junit-test-results-${{ github.run_number }}
        path: test/reports/*.xml
    - name: Remove Lucee build artifacts from local maven cache (avoid growing cache)
      run: |
        rm -rfv ~/.m2/repository/org/lucee/lucee/
    - name: Tag published revision
      if: success() && env.DID_DEPLOY == 'true' && env.TAG != ''
      run: |
        set -euo pipefail
        echo "Creating annotated tag $TAG for $VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists — skipping"
        else
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
        fi
    - name: Attach Lucee artifacts (express zip, jar, light, zero, lco) to the GitHub release
      # LDEV-6529: releases only (no snapshots), uses the files this job just built, nothing comes from cdn.lucee.org
      if: ${{ env.DID_DEPLOY == 'true' && env.VERSION != '' && !contains(env.VERSION, '-SNAPSHOT') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # the version of what was actually built: loader/target/<version>.lco (next to <version>.jvmNN.lco)
        mapfile -t LCOS < <(find loader/target -maxdepth 1 -type f -name '*.lco' ! -name '*.jvm*.lco' -printf '%f\n')
        if [ "${#LCOS[@]}" -ne 1 ]; then
          echo "::error::expected exactly one <version>.lco in loader/target, found [${LCOS[*]:-}]"; exit 1
        fi
        BUILT="${LCOS[0]%.lco}"
        case "$BUILT" in *-SNAPSHOT*) echo "$BUILT is a snapshot, not attaching it to a release"; exit 0;; esac
        if [ "$BUILT" != "$VERSION" ]; then
          echo "::error::VERSION [$VERSION] does not match the built version [$BUILT]"; exit 1
        fi
        if [ -z "${TAG:-}" ]; then
          echo "::error::no release tag for $BUILT (TAG is set by Resolve next revision)"; exit 1
        fi

        # same file names as on cdn.lucee.org
        mkdir -p release-assets
        cp "loader/target/lucee-$BUILT.jar" "release-assets/lucee-$BUILT.jar"
        cp "loader/target/lucee-light-$BUILT.jar" "release-assets/lucee-light-$BUILT.jar"
        cp "loader/target/lucee-zero-$BUILT.jar" "release-assets/lucee-zero-$BUILT.jar"
        cp "loader/target/$BUILT.lco" "release-assets/$BUILT.lco"
        .github/scripts/build-express.sh "$BUILT" "loader/target/lucee-$BUILT.jar" "release-assets/lucee-express-$BUILT.zip"
        .github/scripts/build-war.sh "$BUILT" "loader/target/lucee-$BUILT.jar" "release-assets/lucee-$BUILT.war"
        ls -l release-assets

        # the release uses the annotated tag created by "Tag published revision" (numeric, without qualifier)
        if ! gh release view "$TAG" > /dev/null 2>&1; then
          ARGS=(--verify-tag --title "Lucee $BUILT" --notes "Lucee $BUILT")
          case "$BUILT" in *-RC*|*-BETA*|*-ALPHA*) ARGS+=(--prerelease);; esac
          gh release create "$TAG" "${ARGS[@]}"
        fi
        gh release upload "$TAG" release-assets/* --clobber

    - name: Trigger the Lucee Docker image build
      # LDEV-6536: runs after the maven deploy (was in ant/upload_to_s3.cfm)
      # LDEV-6707: and after the GitHub release, the jar is not on Maven Central anymore
      if: success() && env.DID_DEPLOY == 'true' && env.VERSION != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.LUCEE_DOCKER_FILES_PAT_TOKEN }}
      run: |
        jq -n --arg v "$VERSION" '{event_type: "build-docker-images", client_payload: {LUCEE_VERSION: $v}}' \
          | gh api repos/lucee/lucee-dockerfiles/dispatches --input -
        echo "Lucee Docker build triggered for $VERSION, see https://github.com/lucee/lucee-dockerfiles/actions"
    - name: Regenerate org/lucee index.html and group maven-metadata.xml on S3
      # LDEV-XXXX: what organize-artifacts.yml did after organizing a version, now on every build that was published to S3
      if: ${{ success() && env.DID_DEPLOY == 'true' && env.S3_PUBLISHED == 'true' }}
      run: |
        cd .github/scripts
        npm ci
        node rebuild-group-metadata.js
      env:
        INPUT_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_ID_DOWNLOAD }}
        INPUT_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY_DOWNLOAD }}
        INPUT_S3_BUCKET: ${{ env.S3_DOWNLOAD_BUCKET }}
        INPUT_S3_REGION: ${{ env.S3_DOWNLOAD_REGION }}

    - name: Upload the build to Cloudflare R2 (Maven layout, next to S3)
      # LDEV-6804: same Maven layout files as the S3 upload (org/lucee/lucee/<version>/...), so S3 and cdn.lucee.org can be retired.
      # Independent of the S3 cut-off (LDEV-6537). Runs only when R2 is configured (org variables R2_ENDPOINT and R2_BUCKET),
      # from then on a missing secret or a failed upload fails the job. Not skipped when an earlier step failed, so a published
      # version is never left without its R2 copy; only a cancelled run skips it.
      # SNAPSHOTs go to <R2_PREFIX><R2_SNAPSHOT_PREFIX> (default snapshots/, as in the Maven bridge worker), everything else to <R2_PREFIX>.
      if: ${{ !cancelled() && env.DID_DEPLOY == 'true' && env.VERSION != '' && vars.R2_ENDPOINT != '' && vars.R2_BUCKET != '' }}
      env:
        INPUT_VERSION: ${{ env.VERSION }}
        INPUT_DIR: ${{ github.workspace }}/loader/target
        INPUT_POM: ${{ github.workspace }}/loader/.flattened-pom.xml
        R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        R2_PREFIX: ${{ vars.R2_PREFIX }}
        R2_SNAPSHOT_PREFIX: ${{ vars.R2_SNAPSHOT_PREFIX }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        cd .github/scripts
        npm ci --no-audit --no-fund
        node upload-core-to-r2.js

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: test/reports/*.xml
        check_name: "Lucee Test Results"
